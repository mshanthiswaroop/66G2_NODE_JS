<!-- REGISTRATION FORM -->
<main class="flex-grow-1 d-flex align-items-center py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5">

                <div class="card shadow border-0">

                    <div class="card-body p-4 p-md-5">

                        <h2 class="text-center text-success fw-bold mb-4">
                            User Registration
                        </h2>


                        <form id="registerForm"
                              novalidate>

                            <!-- NAME -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="fullname"
                                       placeholder="Enter your name">

                            </div>


                            <!-- EMAIL -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       placeholder="Enter email">

                            </div>


                            <!-- PASSWORD -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       placeholder="Enter password">

                            </div>


                            <!-- CONFIRM PASSWORD -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Confirm Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       id="confirmPassword"
                                       placeholder="Confirm password">

                            </div>


                            <!-- BUTTON -->
                            <button type="submit"
                                    class="btn btn-success w-100">

                                Register

                            </button>


                            <p id="registerMessage"
                               class="text-center mt-3 fw-bold">
                            </p>

                        </form>


                        <p class="text-center mt-3 mb-0">

                            Already registered?

                            <a href="login.html"
                               class="text-success fw-bold">

                                Login here

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<footer class="bg-dark text-white text-center py-3">

    <p class="mb-0">
        © 2026 Green Campus Sustainability Portal
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

       class="form-control"
       id="fullname"
       placeholder="Enter your name"

<input type="password"
